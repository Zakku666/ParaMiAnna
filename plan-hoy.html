<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14232b">
<title>Plan de hoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Dancing+Script:wght@500;600&family=Great+Vibes&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="particulas" id="particulas" aria-hidden="true"></div>

<main class="planes">
  <a href="index.html" class="volver">&larr; Volver</a>

  <header class="musica-cab">
    <h1 id="ph-titulo">Plan de hoy</h1>
    <p class="sub" id="ph-fecha"></p>
  </header>

  <!-- Pantalla previa (solo para el plan hot) -->
  <div class="ph-puerta" id="ph-puerta" hidden>
    <p class="ph-aviso">Este es solo para ti 🔥</p>
    <button type="button" class="boton hot" id="ph-ver">Ver el plan</button>
  </div>

  <article class="plan cambiando" id="ph-plan" hidden>
    <figure class="plan-foto" id="ph-foto"></figure>
    <h2 class="plan-titulo" id="ph-nombre"></h2>
    <p class="plan-desc" id="ph-desc"></p>

    <div class="ph-respuestas" id="ph-respuestas">
      <button type="button" class="boton romantico" id="ph-si">Me apunto 💗</button>
      <button type="button" class="boton suave" id="ph-no">Otro día 🙈</button>
    </div>
    <p class="nota" id="ph-estado" aria-live="polite"></p>
    <p class="nota" id="ph-transparente">Zac recibe un aviso cuando abres esto 👀</p>
  </article>

  <p class="nota" id="ph-manana"></p>
</main>

<div class="corazones" id="corazones" aria-hidden="true"></div>

<script src="planes-hoy.js" defer></script>
<script src="avisos.js" defer></script>
<script src="script.js" defer></script>
<script src="plan-hoy-vista.js" defer></script>
</body>
</html>
